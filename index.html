<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2A47">
<title>真殿 星哉｜CraftFile 電子名刺</title>
<meta property="og:title" content="真殿 星哉｜株式会社KYOEI CraftFile">
<meta property="og:description" content="建設業が開発した、現場のための工事管理SaaS「CraftFile」の電子名刺です。">
<style>
  :root{
    --navy:#1E2A47;
    --navy-deep:#141D33;
    --orange:#F08519;
    --off:#F7F8F6;
    --ink:#0F1629;
    --line:rgba(247,248,246,.14);
    --text-dim:rgba(247,248,246,.66);
    --card-r:16px;
    --shadow:0 30px 60px -20px rgba(0,0,0,.6),0 12px 24px -12px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--navy-deep);
    background-image:
      radial-gradient(1200px 500px at 50% -10%,rgba(240,133,25,.14),transparent 60%),
      linear-gradient(180deg,var(--navy) 0%,var(--navy-deep) 55%,#0E1526 100%);
    color:var(--off);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
    display:flex;flex-direction:column;
    padding:max(20px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));
    overflow-x:hidden;
  }
  /* blueprint grid backdrop */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(247,248,246,.035) 1px,transparent 1px),
      linear-gradient(90deg,rgba(247,248,246,.035) 1px,transparent 1px);
    background-size:28px 28px;
    mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 70%);
    -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 70%);
  }

  header{
    display:flex;justify-content:space-between;align-items:center;
    max-width:520px;width:100%;margin:0 auto 22px;
    font-size:12px;letter-spacing:.14em;color:var(--text-dim);
  }
  header b{color:var(--off);font-weight:600;letter-spacing:.06em}
  header .pill{
    border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:11px;letter-spacing:.12em;
  }
  header .pill i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--orange);margin-right:6px;vertical-align:1px;box-shadow:0 0 0 3px rgba(240,133,25,.18)}

  main{max-width:520px;width:100%;margin:0 auto;flex:1}

  /* ---------- card ---------- */
  .stage{perspective:1400px;padding:6px 0 4px}
  .card{
    position:relative;width:100%;aspect-ratio:1434/867;
    transform-style:preserve-3d;
    transition:transform .8s cubic-bezier(.2,.75,.2,1);
    cursor:pointer;-webkit-tap-highlight-color:transparent;
    will-change:transform;
  }
  .card.flipped{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;border-radius:var(--card-r);overflow:hidden;
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    box-shadow:var(--shadow);
    background:var(--off);
    outline:1px solid rgba(255,255,255,.08);outline-offset:-1px;
  }
  .face img{display:block;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none;pointer-events:none}
  .face.rear{transform:rotateY(180deg)}

  /* glint: a narrow diagonal light bar sweeping across, like a plastic membership card */
  .face::after{
    content:"";position:absolute;inset:-40%;
    background:linear-gradient(
      105deg,
      transparent 40%,
      rgba(255,255,255,0) 44%,
      rgba(255,255,255,.28) 48%,
      rgba(255,255,255,.75) 50%,
      rgba(255,255,255,.28) 52%,
      rgba(255,255,255,0) 56%,
      transparent 60%
    );
    mix-blend-mode:screen;
    transform:translateX(-70%) rotate(0.001deg);
    animation:glint 5.2s cubic-bezier(.4,.05,.2,1) infinite;
    animation-delay:1.1s;
    pointer-events:none;
  }
  /* soft holo halo that follows the bar */
  .face::before{
    content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.10) 50%,rgba(255,255,255,0) 70%);
    background-size:300% 100%;
    animation:halo 5.2s cubic-bezier(.4,.05,.2,1) infinite;
    animation-delay:1.05s;
    mix-blend-mode:overlay;
  }
  @keyframes glint{
    0%{transform:translateX(-70%)}
    38%{transform:translateX(70%)}
    100%{transform:translateX(70%)}
  }
  @keyframes halo{
    0%{background-position:120% 0}
    38%{background-position:-20% 0}
    100%{background-position:-20% 0}
  }
  .card.flipped .face.rear::after,.card.flipped .face.rear::before{animation-play-state:running}

  /* tilt shadow ground */
  .ground{
    height:26px;margin:2px auto 0;width:78%;
    background:radial-gradient(ellipse at 50% 0,rgba(0,0,0,.55),transparent 70%);
    filter:blur(6px);opacity:.9;
  }
  .hint{
    text-align:center;font-size:12px;color:var(--text-dim);letter-spacing:.06em;
    display:flex;justify-content:center;align-items:center;gap:6px;margin-top:6px;
  }
  .hint svg{width:14px;height:14px;opacity:.75}
  .side-dots{display:inline-flex;gap:5px;margin-left:8px}
  .side-dots i{width:5px;height:5px;border-radius:50%;background:var(--line);transition:background .3s}
  .side-dots i.on{background:var(--orange)}

  /* ---------- identity ---------- */
  .who{margin:26px 0 20px;text-align:center}
  .who .kicker{font-size:11px;letter-spacing:.24em;color:var(--orange);font-weight:600}
  .who h1{font-size:30px;font-weight:800;letter-spacing:.06em;margin-top:6px;line-height:1.15}
  .who .romaji{font-size:12px;letter-spacing:.22em;color:var(--text-dim);margin-top:4px;text-transform:uppercase}
  .who .org{margin-top:10px;font-size:13px;color:var(--text-dim)}
  .who .org b{color:var(--off);font-weight:600}
  .who .tag{
    display:inline-block;margin-top:12px;font-size:12px;
    padding:6px 12px;border-radius:8px;
    background:rgba(240,133,25,.12);color:#FFC58A;border:1px solid rgba(240,133,25,.35);
  }

  /* ---------- actions ---------- */
  .primary{
    display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;min-height:52px;border:0;border-radius:14px;
    background:var(--orange);color:#fff;font-size:16px;font-weight:700;letter-spacing:.04em;
    box-shadow:0 10px 24px -8px rgba(240,133,25,.6);
    cursor:pointer;-webkit-tap-highlight-color:transparent;
    transition:transform .12s,filter .2s;
  }
  .primary:active{transform:scale(.985);filter:brightness(.95)}
  .primary svg{width:20px;height:20px}

  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
  .grid a{
    display:flex;flex-direction:column;align-items:center;gap:8px;
    min-height:76px;padding:12px 6px;border-radius:14px;text-decoration:none;
    background:rgba(247,248,246,.06);border:1px solid var(--line);color:var(--off);
    font-size:12px;letter-spacing:.04em;
    transition:background .2s,transform .12s;-webkit-tap-highlight-color:transparent;
  }
  .grid a:active{transform:scale(.97);background:rgba(247,248,246,.12)}
  .grid a svg{width:22px;height:22px;stroke:var(--orange)}

  .rows{margin-top:18px;border-top:1px solid var(--line)}
  .rows a,.rows div{
    display:flex;align-items:center;gap:12px;
    padding:14px 4px;border-bottom:1px solid var(--line);
    text-decoration:none;color:var(--off);font-size:14px;min-height:48px;
  }
  .rows span.k{width:64px;flex:none;font-size:11px;letter-spacing:.14em;color:var(--text-dim)}
  .rows span.v{flex:1;word-break:break-all}
  .rows svg{width:16px;height:16px;stroke:var(--text-dim);flex:none}

  .share{
    margin-top:18px;display:flex;gap:10px;
  }
  .share button{
    flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line);
    background:transparent;color:var(--off);font-size:13px;letter-spacing:.04em;
    display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
    -webkit-tap-highlight-color:transparent;transition:background .2s;
  }
  .share button:active{background:rgba(247,248,246,.1)}
  .share svg{width:16px;height:16px}

  footer{
    max-width:520px;width:100%;margin:28px auto 0;text-align:center;
    font-size:11px;letter-spacing:.1em;color:rgba(247,248,246,.4);
  }
  footer b{color:rgba(247,248,246,.6);font-weight:600}

  .toast{
    position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
    background:var(--off);color:var(--navy);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;
    opacity:0;pointer-events:none;transition:.3s;box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  :focus-visible{outline:2px solid var(--orange);outline-offset:3px;border-radius:14px}
  @media (prefers-reduced-motion:reduce){
    .face::after,.face::before{animation:none}
    .card{transition:none}
  }
  @media (min-width:600px){
    body{justify-content:center}
    .who h1{font-size:34px}
  }
</style>
</head>

<script>
(function(){
  const card=document.getElementById('card');
  const d1=document.getElementById('d1'),d2=document.getElementById('d2');
  let flipped=false,tx=0,ty=0;
  const apply=()=>{card.style.transform=`rotateY(${flipped?180:0}deg) rotateX(${ty}deg) rotateY(${tx}deg)`;};
  function flip(){flipped=!flipped;tx=0;ty=0;card.classList.toggle('flipped',flipped);d1.classList.toggle('on',!flipped);d2.classList.toggle('on',flipped);apply();}
  card.addEventListener('click',flip);
  card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}});

  // subtle tilt on pointer / device motion (kept small so the glint stays the star)
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce){
    card.addEventListener('pointermove',e=>{
      const r=card.getBoundingClientRect();
      tx=((e.clientX-r.left)/r.width-.5)*10; ty=-((e.clientY-r.top)/r.height-.5)*10; apply();
    });
    card.addEventListener('pointerleave',()=>{tx=0;ty=0;apply();});
    if(window.DeviceOrientationEvent){
      window.addEventListener('deviceorientation',e=>{
        if(e.gamma==null)return;
        tx=Math.max(-8,Math.min(8,e.gamma/6)); ty=Math.max(-8,Math.min(8,-(e.beta-45)/8)); apply();
      });
    }
  }

  // toast
  const toast=document.getElementById('toast');let tt;
  function say(m){toast.textContent=m;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),1800);}

  // vCard
  const vcf=[
    'BEGIN:VCARD','VERSION:3.0',
    'N:真殿;星哉;;;','FN:真殿 星哉',
    'X-PHONETIC-LAST-NAME:まどの','X-PHONETIC-FIRST-NAME:せいや',
    'ORG:株式会社KYOEI;CraftFile','TITLE:IT事業部長 / CPO',
    'TEL;TYPE=WORK,VOICE:072-349-3278',
    'EMAIL;TYPE=WORK:info@craftfile.jp',
    'URL:https://craftfile.jp',
    'ADR;TYPE=WORK:;;堺市西区堀上町2-2-15;大阪府;;;日本',
    'NOTE:建設業が開発した、現場のための工事管理SaaS「CraftFile」',
    'END:VCARD'
  ].join('\r\n');
  document.getElementById('save').addEventListener('click',()=>{
    const blob=new Blob([vcf],{type:'text/vcard;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='Madono_Seiya_CraftFile.vcf';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    say('連絡先ファイルを開きました');
  });

  // share / copy
  const shareData={title:'真殿 星哉｜CraftFile 電子名刺',text:'株式会社KYOEI 真殿星哉の電子名刺です。',url:location.href};
  document.getElementById('shareBtn').addEventListener('click',async()=>{
    if(navigator.share){try{await navigator.share(shareData);}catch(e){}}
    else{copy();}
  });
  async function copy(){
    try{await navigator.clipboard.writeText(location.href);say('URLをコピーしました');}
    catch(e){prompt('URLをコピー',location.href);}
  }
  document.getElementById('copyBtn').addEventListener('click',copy);
})();
</script>
